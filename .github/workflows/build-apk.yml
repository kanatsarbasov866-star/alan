name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter жобасын құру және кодты қою
        run: |
          flutter create --project-name alan --org kz.alan --platforms=android .
          cp alan_app.dart lib/main.dart
          flutter pub add shared_preferences path_provider pdf share_plus image_picker firebase_core cloud_firestore
          # Firebase пакеттері үшін minSdk 23 керек
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle*
          # Қосымша атауы
          sed -i 's/android:label="alan"/android:label="Алаң"/' android/app/src/main/AndroidManifest.xml

      - name: Иконка қою
        run: |
          mkdir -p assets/icon
          cp icon_1024.png assets/icon/icon_1024.png
          cp icon_foreground.png assets/icon/icon_foreground.png
          flutter pub add --dev flutter_launcher_icons
          cat >> pubspec.yaml << 'EOF'

          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon_1024.png"
            adaptive_icon_background: "#283593"
            adaptive_icon_foreground: "assets/icon/icon_foreground.png"
          EOF
          dart run flutter_launcher_icons

      - name: APK жинау
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: alan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
