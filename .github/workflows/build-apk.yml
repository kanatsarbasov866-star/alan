name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter жобасын құру және кодты қою
        run: |
          flutter create --project-name alan --org kz.alan --platforms=android .
          cp main_3.dart lib/main.dart
          flutter pub add shared_preferences path_provider pdf share_plus image_picker firebase_core cloud_firestore
          # Firebase пакеттері үшін minSdk 23 керек
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle*
          # Қосымша атауы
          sed -i 's/android:label="alan"/android:label="Алаң"/' android/app/src/main/AndroidManifest.xml

      - name: APK жинау
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: alan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
