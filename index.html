<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Алаң">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#283593">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Алаң — Футбол есебі</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f8;--card:#fff;--ink:#16193a;--mut:#666b8c;--pri:#283593;--priink:#fff;--acc:#2e9e5b;--line:#dfe2f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1124;--card:#181c38;--ink:#eceefb;--mut:#9aa0c8;--pri:#7986cb;--priink:#0e1124;--acc:#4cc183;--line:#2a2f57}}
:root[data-theme="dark"]{--bg:#0e1124;--card:#181c38;--ink:#eceefb;--mut:#9aa0c8;--pri:#7986cb;--priink:#0e1124;--acc:#4cc183;--line:#2a2f57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--pri);color:var(--priink);display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:19px;font-weight:700}
header b{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:none;border:0;font-size:20px;padding:4px 8px;color:inherit}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card small{display:block;color:var(--mut)}
.btn{background:var(--pri);color:var(--priink);border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.alt{background:none;border:1.5px solid var(--pri);color:var(--pri)}
.btn.go{background:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(16px + env(safe-area-inset-bottom,0px));border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px #0004}
.tabs{display:flex;background:var(--pri);position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:4}
.tabs button{flex:1;background:none;border:0;padding:11px 4px;color:var(--priink);opacity:.65;border-bottom:3px solid transparent}
.tabs button.on{opacity:1;border-color:var(--priink);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
label{color:var(--mut);font-size:14px}
.seg{display:flex;gap:8px;margin:6px 0 14px}.seg button{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
td:first-child,th:first-child{text-align:left;padding-left:12px;font-weight:600}
th{color:var(--mut);font-size:13px;font-weight:600}
.wrap{overflow-x:auto}
.board{display:flex;align-items:flex-start;justify-content:space-around;text-align:center;margin:8px 0}
.board>div{flex:1}
.board .n{font-weight:600}
.board .s{font-size:68px;font-weight:800;color:var(--pri);line-height:1.1;font-variant-numeric:tabular-nums}
.board .c{font-size:44px;padding-top:30px;font-weight:700}
.clock{text-align:center;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.stat{color:var(--mut);text-align:center;margin-bottom:6px}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0}
.mod{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.mod>div{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:380px;max-height:80vh;overflow:auto}
.mod h3{margin:0 0 10px}.mod .btn{display:block;width:100%;margin-bottom:8px}
.pill{background:var(--acc);color:#fff;border-radius:20px;padding:2px 10px;font-weight:700}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--line);color:var(--pri);font-weight:700;background-size:cover;background-position:center;flex:none;vertical-align:middle;margin-right:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.grid div{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px 4px}
.grid b{display:block;font-size:24px;color:var(--pri)}.grid small{color:var(--mut)}
tr.lnk{cursor:pointer}
input[type=checkbox]{width:auto;margin:0 10px 0 0}
.sc{width:54px;text-align:center;margin:0;padding:8px 4px}
.br{display:flex;gap:14px;min-width:max-content;padding-bottom:6px}
.col{display:flex;flex-direction:column;justify-content:space-around;min-width:210px;gap:10px}
.rt{text-align:center;color:var(--mut);font-weight:600;font-size:14px}
.mt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.tm{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0}
.tm.win span{font-weight:700;color:var(--acc)}
.mt select{margin:4px 0 0;padding:6px}
tr.q td{background:color-mix(in srgb,var(--acc) 15%,transparent)}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:18px}
</style></head><body><div id="app"></div>
<script>
const KEY='alan_days';let days=[];
try{days=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
let TR=[];try{TR=JSON.parse(localStorage.getItem('alan_tour')||'[]')}catch(e){}
const saveT=()=>{try{localStorage.setItem('alan_tour',JSON.stringify(TR))}catch(e){}};
const TT=()=>TR.find(t=>t.id===V.tid);
let PR={};try{PR=JSON.parse(localStorage.getItem('alan_prof')||'{}')}catch(e){}
const savePR=()=>{try{localStorage.setItem('alan_prof',JSON.stringify(PR))}catch(e){alert('Фото сақталмады: жад толған')}};
const pk=n=>n.trim().toLowerCase();
const av=(n,z)=>{const ph=(PR[pk(n)]||{}).photo;return `<span class="av" style="width:${z}px;height:${z}px;font-size:${z*.45}px${ph?`;background-image:url(${ph})`:''}">${ph?'':esc(n.trim()[0]||'?').toUpperCase()}</span>`};
function setF(f,v){(PR[pk(V.pl)]=PR[pk(V.pl)]||{})[f]=v.trim();savePR()}
function pf(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const k=Math.min(im.width,im.height),x=c.getContext('2d');x.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,240,240);(PR[pk(V.pl)]=PR[pk(V.pl)]||{}).photo=c.toDataURL('image/jpeg',.75);savePR();render()};im.src=r.result};r.readAsDataURL(f)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(days))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
let V={v:'home',tab:0,n:2,id:null,mi:null,sp:'football',ns:'football',ts:'football',ttab:0,tid:null},tick=null;
const D=()=>days.find(d=>d.id===V.id), M=()=>D().m[V.mi];
const SPN={football:'⚽ Футбол',basketball:'🏀 Баскетбол',volleyball:'🏐 Волейбол'},SPI={football:'⚽',basketball:'🏀',volleyball:'🏐'},GL={football:'Гол',basketball:'Ұпай',volleyball:'Ұпай'};
const sp=d=>(d&&d.sport)||'football',SD=()=>days.filter(d=>sp(d)===V.sp);
const sc=(m,t)=>m.sets?m.sets.filter(x=>x.w===t).length:m.g.reduce((a,x)=>a+(x.t===t?(x.pts||1):0),0);
const stt=m=>m.fin?'Аяқталды':m.sets?(m.sets.length+1)+'-сет':m.q?m.q+'-тоқсан':m.br?'Перерыв':m.h+'-тайм';
const spSel=()=>`<div class="seg">`+Object.keys(SPN).map(k=>`<button class="btn ${V.sp===k?'':'alt'}" onclick="A('sp','${k}')">${SPN[k]}</button>`).join('')+`</div>`;
const names=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
const today=()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');return p(n.getDate())+'.'+p(n.getMonth()+1)+'.'+n.getFullYear()};

function table(d){const W=sp(d)==='football'?3:2,r={};d.teams.forEach(t=>r[t]={n:t,p:0,w:0,d:0,l:0,f:0,a:0,pt:0});
 d.m.filter(m=>m.fin).forEach(m=>{const a=sc(m,m.a),b=sc(m,m.b),A=r[m.a],B=r[m.b];
  A.p++;B.p++;A.f+=a;A.a+=b;B.f+=b;B.a+=a;
  if(a>b){A.w++;B.l++;A.pt+=W}else if(a<b){B.w++;A.l++;B.pt+=W}else{A.d++;B.d++;A.pt++;B.pt++}});
 return Object.values(r).sort((x,y)=>y.pt-x.pt||(y.f-y.a)-(x.f-x.a)||y.f-x.f)}

function stats(list){const o={};const g=n=>o[n.trim().toLowerCase()]||(o[n.trim().toLowerCase()]={n:n.trim(),g:0,a:0,m:0,d:0,t:''});
 list.forEach(d=>{const fin=d.m.filter(m=>m.fin);
  Object.entries(d.p).forEach(([t,pl])=>pl.forEach(n=>{const s=g(n);s.d++;s.t=t;s.m+=fin.filter(m=>m.a===t||m.b===t).length}));
  d.m.forEach(m=>m.g.forEach(x=>{if(x.a){const q=g(x.a);q.a++;q.t=x.t}if(x.p==='Белгісіз')return;const s=g(x.p);s.g+=x.pts||1;s.t=x.t}))});
 return Object.values(o).sort((a,b)=>b.g-a.g||b.a-a.a||a.m-b.m)}

function A(a,x){
 if(a==='home'){V.v='home'}
 else if(a==='new'){V.v='new'}
 else if(a==='stats'){V.v='stats'}
 else if(a==='open'){V.v='day';V.id=x;V.tab=0;V.sp=sp(days.find(d=>d.id===x))}
 else if(a==='tab'){V.tab=x}
 else if(a==='n'){V.n=x}
 else if(a==='ns'){V.ns=x}
 else if(a==='sp'){V.sp=x}
 else if(a==='nq'){M().q++;save()}
 else if(a==='tours'){V.v='tours'}
 else if(a==='tnew'){V.v='tnew'}
 else if(a==='ts'){V.tn=$('#tn')&&$('#tn').value;V.tt=$('#tt')&&$('#tt').value;V.tg=$('#tg')&&$('#tg').value;V.tb=$('#tb')&&$('#tb').value;V.ts=x}
 else if(a==='topen'){V.v='tour';V.tid=x;V.ttab=0}
 else if(a==='ttab'){V.ttab=x}
 else if(a==='tdel'){if(confirm('Турнир өшеді. Растайсыз ба?')){TR=TR.filter(t=>t.id!==x);saveT()}}
 else if(a==='tdemo'){tdemo();saveT()}
 else if(a==='tcreate'){tcreate();return}
 else if(a==='mko'){mko();return}
 else if(a==='edit'){editP();return}
 else if(a==='rep'){showRep();return}
 else if(a==='season'){V.v='season';V.yr=V.yr||null}
 else if(a==='yr'){V.yr=x}
 else if(a==='pl'){V.from=V.v;V.pl=decodeURIComponent(x);V.v='pl'}
 else if(a==='back'){V.v=V.from==='day'?'day':'stats'}
 else if(a==='nophoto'){(PR[pk(V.pl)]||{}).photo='';savePR()}
 else if(a==='del'){if(confirm('Бұл ойын күні өшеді. Растайсыз ба?')){days=days.filter(d=>d.id!==x);save()}}
 else if(a==='demo'){demo();save()}
 else if(a==='create'){create();return}
 else if(a==='newm'){newMatch();return}
 else if(a==='delm'){if(confirm('Матч өшеді. Растайсыз ба?')){D().m.splice(x,1);save()}}
 else if(a==='om'){V.v='match';V.mi=x}
 else if(a==='goal'){goal(x);return}
 else if(a==='undo'){M().g.splice(x,1);save()}
 else if(a==='run'){const m=M();if(m.br){m.br=false;m.h=2}m.run=true;save()}
 else if(a==='pause'){M().run=false;save()}
 else if(a==='brk'){const m=M();m.run=false;m.br=true;save()}
 else if(a==='fin'){const m=M();m.fin=!m.fin;if(m.fin){m.run=false;m.br=false}save()}
 render()}

function modal(html){const e=document.createElement('div');e.className='mod';e.innerHTML='<div>'+html+'</div>';
 e.onclick=ev=>{if(ev.target===e)e.remove()};document.body.appendChild(e);return e}

function create(){const n=V.n,teams=[],p={};
 for(let i=0;i<n;i++){let t=$('#t'+i).value.trim()||'Команда '+(i+1);while(teams.includes(t))t+='*';teams.push(t);p[t]=names(($('#p'+i)||{value:''}).value)}
 const d={id:String(Date.now()),date:today(),sport:V.ns,teams,p,m:[]};days.unshift(d);save();V={...V,v:'day',id:d.id,tab:0};render()}

function newMatch(){const d=D(),o=d.teams.map(t=>`<option>${esc(t)}</option>`).join('');
 const e=modal(`<h3>Жаңа матч</h3><select id="ma">${o}</select><select id="mb">${o}</select><button class="btn" id="mk">Бастау</button>`);
 $('#mb').selectedIndex=1;
 $('#mk').onclick=()=>{const a=$('#ma').value,b=$('#mb').value;if(a===b){alert('Екі түрлі команда таңдаңыз');return}
  const k=sp(d);d.m.push({a,b,g:[],s:0,h:1,br:false,run:false,fin:false,...(k==='volleyball'?{sets:[],c:{a:0,b:0}}:k==='basketball'?{q:1}:{})});save();e.remove();V.v='match';V.mi=d.m.length-1;render()}}

function goal(t){const m=M(),d=D();if(m.fin||m.br)return;
 const e=modal(`<h3>${esc(t)} — гол кімнен?</h3>`+(d.p[t]||[]).map((p,i)=>`<button class="btn alt" data-p="${i}">${esc(p)}</button>`).join('')+`<button class="btn alt" data-p="-1">Белгісіз</button>`);
 e.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;
  e.remove();assist(t,i<0?'Белгісіз':d.p[t][i])})}
function assist(t,sc){const m=M(),d=D(),L=(d.p[t]||[]).filter(p=>p!==sc);
 const fin=a=>{m.g.push({t,p:sc,a,min:m.s?Math.floor(m.s/60)+1:0});save();e.remove();render()};
 const e=modal(`<h3>Ассист кімнен?</h3>`+L.map((p,i)=>`<button class="btn alt" data-q="${i}">${esc(p)}</button>`).join('')+`<button class="btn" data-q="-1">Ассистсіз</button>`);
 e.onclick=ev=>{if(ev.target===e)fin('')};
 e.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const i=+b.dataset.q;fin(i<0?'':L[i])})}

function editP(){const d=D();
 const e=modal(`<h3>Ойыншыларды өңдеу</h3><p class="note" style="margin:0 0 8px;text-align:left">Үтір арқылы жазыңыз. Бұрын жазылған голдардағы аттар өзгермейді.</p>`+d.teams.map((t,i)=>`<label>${esc(t)}</label><input id="ep${i}" value="${esc((d.p[t]||[]).join(', '))}">`).join('')+`<button class="btn go" id="eps">Сақтау</button>`);
 $('#eps').onclick=()=>{d.teams.forEach((t,i)=>{d.p[t]=names($('#ep'+i).value)});save();e.remove();render()}}

function report(d){
 const k=sp(d),ms=d.m,tb=table(d),pl=stats([d]).filter(x=>x.g>0||x.a>0),unit=k==='football'?'гол':'ұпай';
 const W=900,H=114+76+44*ms.length+76+44+46*tb.length+(k==='volleyball'?0:76+44*pl.length)+40;
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 const F=(w,z)=>x.font=`${w} ${z}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;
 const cut=t=>String(t).slice(0,22);
 let y=70;x.fillStyle='#283593';F(800,48);x.fillText(SPI[k]+' Алаң',40,y);
 y+=44;x.fillStyle='#666';F(400,28);x.fillText(SPN[k]+' • '+d.date,40,y);
 const sec=t=>{y+=62;x.fillStyle='#283593';F(700,32);x.fillText(t,40,y);y+=14;x.fillStyle='#16193a';F(500,28)};
 sec('Матчтар');
 ms.forEach(m=>{y+=44;x.fillText(cut(m.a)+'  '+sc(m,m.a)+' : '+sc(m,m.b)+'  '+cut(m.b),40,y)});
 sec('Кесте');
 const cx=[40,430,500,570,640,710,810];
 y+=44;x.fillStyle='#666';F(600,24);['Команда','О','Ж','Т','Жғ','Гол','Ұпай'].forEach((t,i)=>x.fillText(t,cx[i],y));
 x.fillStyle='#16193a';F(500,28);
 tb.forEach(r=>{y+=46;[cut(r.n),r.p,r.w,r.d,r.l,r.f+'-'+r.a,r.pt].forEach((t,i)=>x.fillText(String(t),cx[i],y))});
 if(k!=='volleyball'){sec('Бомбардирлер');
  pl.forEach((q,i)=>{y+=44;x.fillText((i+1)+'. '+cut(q.n)+' ('+cut(q.t)+') — '+q.g+' '+unit+(k==='football'?', '+q.a+' ассист':''),40,y)})}
 return c}

function showRep(){const d=D(),c=report(d);
 const e=modal(`<h3>Нәтиже суреті</h3><img src="${c.toDataURL('image/png')}" style="width:100%;border-radius:8px;border:1px solid var(--line)" alt="Нәтиже"><p class="note">Телефонда суретті басып ұстап та сақтауға болады.</p><button class="btn go" id="dl">⬇ Жүктеу</button>`);
 $('#dl').onclick=()=>c.toBlob(async b=>{try{const dl=window.claude&&await claude.use('downloads');
  if(!dl){alert('Жүктеу қолжетімсіз. Суретті басып ұстап сақтаңыз.');return}
  await dl.save({filename:'alan_'+d.date+'.png',data:b})}catch(err){if(!err||err.code!=='declined')alert('Сақталмады')}},'image/png')}

function bp(t,n){const m=M(),d=D();if(m.fin)return;
 const e=modal(`<h3>${esc(t)} +${n} — кім?</h3>`+(d.p[t]||[]).map((p,i)=>`<button class="btn alt" data-p="${i}">${esc(p)}</button>`).join('')+`<button class="btn alt" data-p="-1">Белгісіз</button>`);
 e.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const i=+b.dataset.p;m.g.push({t,p:i<0?'Белгісіз':d.p[t][i],pts:n,q:m.q});save();e.remove();render()})}
function vp(t,k){const m=M();if(m.fin)return;const i=t===m.a?'a':'b';m.c[i]=Math.max(0,m.c[i]+k);
 const lim=m.sets.length===4?15:25,a=m.c.a,b=m.c.b;
 if(k>0&&Math.max(a,b)>=lim&&Math.abs(a-b)>=2){const w=a>b?m.a:m.b;m.sets.push({a,b,w});m.c={a:0,b:0};if(sc(m,w)>=3)m.fin=true}
 save();render()}

// ===== ТУРНИР =====
function gtable(teams,ms,sport){const W=sport==='football'?3:2,r={};teams.forEach(t=>r[t]={n:t,p:0,w:0,d:0,l:0,f:0,a:0,pt:0});
 ms.filter(m=>m.sa!=null&&m.sb!=null).forEach(m=>{const A=r[m.a],B=r[m.b],a=m.sa,b=m.sb;A.p++;B.p++;A.f+=a;A.a+=b;B.f+=b;B.a+=a;
  if(a>b){A.w++;B.l++;A.pt+=W}else if(a<b){B.w++;A.l++;B.pt+=W}else{A.d++;B.d++;A.pt++;B.pt++}});
 return Object.values(r).sort((x,y)=>y.pt-x.pt||(y.f-y.a)-(x.f-x.a)||y.f-x.f)}
const seeds=n=>{let a=[1,2];while(a.length<n){const m=a.length*2+1;a=a.flatMap(x=>[x,m-x])}return a};
const rname=n=>n===1?'Финал':n===2?'Жартылай финал':n===4?'1/4 финал':'1/'+n+' финал';
const kt=(t,r,i)=>r===0?[t.ko[0][i].a,t.ko[0][i].b]:[t.ko[r-1][2*i].w,t.ko[r-1][2*i+1].w];

function tcreate(){
 const name=$('#tn').value.trim()||'Турнир',G=+$('#tg').value,B=+$('#tb').value,teams=[...new Set(names($('#tt').value))];
 const adv=B/G;
 if(!Number.isInteger(adv)){alert('Плей-оффқа шығатын командалар саны топ санына бөлінуі керек (мыс. 2 топ → 4 команда)');return}
 const groups=Array.from({length:G},(_,i)=>({name:String.fromCharCode(65+i),teams:[]}));
 teams.forEach((t,i)=>{const r=Math.floor(i/G),pos=i%G;groups[r%2===0?pos:G-1-pos].teams.push(t)});
 if(groups.some(g=>g.teams.length<Math.max(2,adv))){alert('Командалар аз: әр топта кемінде '+Math.max(2,adv)+' команда болуы керек');return}
 const gm=[];groups.forEach((g,gi)=>{for(let i=0;i<g.teams.length;i++)for(let j=i+1;j<g.teams.length;j++)gm.push({g:gi,a:g.teams[i],b:g.teams[j],sa:null,sb:null})});
 const t={id:String(Date.now()),name,sport:V.ts,groups,adv,B,gm,ko:null,date:today()};
 TR.unshift(t);saveT();V.v='tour';V.tid=t.id;V.ttab=0;render()}

function makeKO(t){
 const tabs=t.groups.map((g,gi)=>gtable(g.teams,t.gm.filter(m=>m.g===gi),t.sport)),G=t.groups.length,gof={};
 t.groups.forEach((g,gi)=>g.teams.forEach(n=>gof[n]=gi));
 const ranked=[];for(let pos=0;pos<t.adv;pos++)tabs.map(tb=>tb[pos]).sort((x,y)=>y.pt-x.pt||(y.f-y.a)-(x.f-x.a)||y.f-x.f).forEach(r=>ranked.push(r.n));
 const bad=ps=>ps.some(([a,b])=>gof[a]===gof[b]);
 const fix=ps=>{for(let i=0;i<ps.length;i++){const [a,b]=ps[i];if(gof[a]!==gof[b])continue;
  for(let j=0;j<ps.length;j++){if(j===i)continue;const [c,d]=ps[j];if(gof[a]!==gof[d]&&gof[c]!==gof[b]){ps[i]=[a,d];ps[j]=[c,b];break}}}return ps};
 const mode=t.pm||'cross';let pairs=[];
 if(mode==='cross'&&t.adv===2&&G%2===0){const f=[],s=[];for(let g=0;g<G;g+=2){f.push([tabs[g][0].n,tabs[g+1][1].n]);s.push([tabs[g+1][0].n,tabs[g][1].n])}pairs=[...f,...s]}
 else if(mode==='rand'){for(let k=0;k<300;k++){const q=[...ranked];for(let i=q.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[q[i],q[j]]=[q[j],q[i]]}
   pairs=[];for(let i=0;i<q.length;i+=2)pairs.push([q[i],q[i+1]]);if(!bad(pairs))break}}
 else{const sd=seeds(t.B);for(let i=0;i<sd.length;i+=2)pairs.push([ranked[sd[i]-1],ranked[sd[i+1]-1]]);pairs=fix(pairs)}
 const R=[pairs.map(([a,b])=>({a,b,sa:null,sb:null,w:null}))];
 for(let n=pairs.length/2;n>=1;n/=2)R.push(Array.from({length:n},()=>({sa:null,sb:null,w:null})));
 t.ko=R;t.tp=null}

function tset(k,v){TT()[k]=v;saveT();render()}
function tpTeams(t){const r=t.ko.length-2,out=[];for(let i=0;i<2;i++){const [a,b]=kt(t,r,i),w=t.ko[r][i].w;out.push(w?(w===a?b:a):null)}return out}
function tpSync(t){if(!t.third||!t.ko||t.ko.length<2)return;const [a,b]=tpTeams(t);if(!t.tp||t.tp.a!==a||t.tp.b!==b)t.tp={a,b,sa:null,sb:null,w:null}}
function tpset(f,v){const t=TT();tpSync(t);const m=t.tp,a=m.a,b=m.b;
 if(f==='w'){m.w=v||null}else{m[f]=v===''?null:Math.max(0,+v);
  if(m.sa!=null&&m.sb!=null){if(m.sa>m.sb)m.w=a;else if(m.sa<m.sb)m.w=b;else if(m.w!==a&&m.w!==b)m.w=null}else m.w=null}
 saveT();render()}
function tpCard(t){const m=t.tp,a=m.a,b=m.b,tie=m.sa!=null&&m.sa===m.sb;
 const row=(n,f,sv)=>`<div class="tm${m.w&&m.w===n?' win':''}"><span>${n?esc(n):'—'}</span><input class="sc" type="number" min="0" ${a&&b?'':'disabled'} value="${sv??''}" onchange="tpset('${f}',this.value)"></div>`;
 return `<h3>🥉 3-орын матчы</h3><div class="mt" style="max-width:280px">${row(a,'sa',m.sa)}${row(b,'sb',m.sb)}${tie?`<select onchange="tpset('w',this.value)"><option value="">Жеңімпаз (пенальти)?</option><option value="${esc(a)}" ${m.w===a?'selected':''}>${esc(a)}</option><option value="${esc(b)}" ${m.w===b?'selected':''}>${esc(b)}</option></select>`:''}</div>`}

function mko(){const t=TT(),left=t.gm.filter(m=>m.sa==null||m.sb==null).length;
 if(left&&!confirm(left+' матчтың нәтижесі жоқ. Бәрібір плей-оффты құрамыз ба?'))return;
 if(t.ko&&!confirm('Бұрынғы сетка нәтижелерімен өшеді. Растайсыз ба?'))return;
 makeKO(t);saveT();V.ttab=1;render()}

function gset(i,f,v){const t=TT();t.gm[i][f]=v===''?null:Math.max(0,+v);saveT();render()}

function kset(t,r,i,f,v){const m=t.ko[r][i],[a,b]=kt(t,r,i),old=m.w;
 if(f==='w'){m.w=v||null}
 else{m[f]=v===''?null:Math.max(0,+v);
  if(m.sa!=null&&m.sb!=null){if(m.sa>m.sb)m.w=a;else if(m.sa<m.sb)m.w=b;else if(m.w!==a&&m.w!==b)m.w=null}else m.w=null}
 if(m.w!==old){let j=i;for(let k=r+1;k<t.ko.length;k++){j>>=1;const n=t.ko[k][j];n.sa=n.sb=n.w=null}}}
function kres(r,i,f,v){kset(TT(),r,i,f,v);saveT();render()}

   h+=`<p class="note" style="text-align:left">Жасыл жолдар — плей-оффқа шығатын командалар.</p><h3>Плей-офф баптаулары</h3><label>Жұптасу тәртібі</label><select onchange="tset('pm',this.value)">${[['cross','Кросс: А1–Б2, Б1–А2'],['seed','Рейтинг бойынша: күшті — әлсіз'],['rand','Жеребьёвка (кездейсоқ)']].map(([k,n])=>`<option value="${k}" ${(t.pm||'cross')===k?'selected':''}>${n}</option>`).join('')}</select><p class="note" style="text-align:left;margin:0 0 10px">Кросс тек әр топтан 2 команда шығып, топ саны жұп болғанда қолданылады, әйтпесе рейтинг бойынша жұптасады. Бір топтағы командалар алғашқы турда кездеспеуге тырысады. Тәртіпті өзгерткен соң «Плей-оффты қайта құру» басыңыз.</p><label style="display:flex;align-items:center;color:var(--ink)"><input type="checkbox" ${t.third?'checked':''} onchange="tset('third',this.checked)"> 3-орын матчы (жартылай финалда жеңілгендер)</label><div style="height:12px"></div><button class="btn go" style="width:100%" onclick="A('mko')">${t.ko?'Плей-оффты қайта құру':'Плей-оффты құру'}</button>`}
  else if(!t.ko)h+=`<div class="empty">Сетка әлі жоқ.<br>«Топтар» қойындысында нәтижелерді енгізіп, «Плей-оффты құру» батырмасын басыңыз.</div>`;
  else{
   h+=(champ?(()=>{const L=t.ko.length-1,[fa,fb]=kt(t,L,0),sil=fa===champ?fb:fa,bro=t.third&&t.tp&&t.tp.w;return `<div class="card" style="display:block;text-align:center;font-size:19px">🏆 Чемпион: <b>${esc(champ)}</b><br><span style="font-size:16px">🥈 ${esc(sil)}${bro?' &nbsp; 🥉 '+esc(bro):''}</span></div>`})():'')+`<div class="wrap"><div class="br">`+t.ko.map((rd,r)=>`<div class="col"><div class="rt">${rname(rd.length)}</div>`+rd.map((m,i)=>{
     const [a,b]=kt(t,r,i),tie=m.sa!=null&&m.sa===m.sb,row=(n,f,sv)=>`<div class="tm${m.w&&m.w===n?' win':''}"><span>${n?esc(n):'—'}</span><input class="sc" type="number" min="0" ${a&&b?'':'disabled'} value="${sv??''}" onchange="kres(${r},${i},'${f}',this.value)"></div>`;
     return `<div class="mt">${row(a,'sa',m.sa)}${row(b,'sb',m.sb)}${tie?`<select onchange="kres(${r},${i},'w',this.value)"><option value="">Жеңімпаз (пенальти)?</option><option value="${esc(a)}" ${m.w===a?'selected':''}>${esc(a)}</option><option value="${esc(b)}" ${m.w===b?'selected':''}>${esc(b)}</option></select>`:''}</div>`}).join('')+`</div>`).join('')+`</div></div>${t.third&&t.tp?tpCard(t):''}<p class="note">Тең есеп болса, пенальти жеңімпазын таңдаңыз. Алдыңғы кезең нәтижесі өзгерсе, келесі кезеңдер тазаланады.</p>`}
  h+=`</main>`}
 else if(v==='day'){
  const d=D();if(!d){V.v='home';return render()}
  h=head('Ойын күні '+d.date,'home')+(sp(d)==='volleyball'?'':`<button class="ic" onclick="A('edit')" title="Ойыншыларды өңдеу">👥</button>`)+`<button class="ic" onclick="A('rep')" title="Нәтижені сурет ретінде">📤</button></header><div class="tabs">`+['Матчтар','Кесте','Бомбардир'].map((t,i)=>`<button class="${V.tab===i?'on':''}" onclick="A('tab',${i})">${t}</button>`).join('')+`</div><main>`;
  if(V.tab===0){h+=(d.m.length?d.m.map((m,i)=>`<div class="card" onclick="A('om',${i})"><div><b>${esc(m.a)} ${sc(m,m.a)} : ${sc(m,m.b)} ${esc(m.b)}</b><small>${stt(m)}</small></div><button class="ic" onclick="event.stopPropagation();A('delm',${i})">🗑</button></div>`).join(''):'<div class="empty">Матч жоқ</div>')+
   `</main><button class="btn fab" onclick="A('newm')">+ Матч</button>`}
  else if(V.tab===1){h+=`<div class="wrap"><table><tr><th>Команда</th><th>О</th><th>Ж</th><th>Т</th><th>Жғ</th><th>Гол</th><th>Ұпай</th></tr>`+table(d).map(r=>`<tr><td>${esc(r.n)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.f}-${r.a}</td><td><b>${r.pt}</b></td></tr>`).join('')+`</table></div></main>`}
  else{const s=stats([d]).filter(x=>x.g>0||x.a>0);h+=(s.length?s.map((x,i)=>`<div class="card" onclick="A('pl','${encodeURIComponent(x.n)}')"><div style="display:flex;align-items:center">${av(x.n,38)}<div><b>${i+1}. ${esc(x.n)}</b><small>${esc(x.t)}</small></div></div><span class="pill">${SPI[V.sp]} ${x.g}${V.sp==='football'?` · 🅰 ${x.a}`:''}</span></div>`).join(''):'<div class="empty">Әзірге гол жоқ</div>')+`</main>`}}
 else if(v==='match'&&D()&&sp(D())!=='football'){
  const d=D(),m=M();if(!m){V.v='day';return render()}
  const vb=!!m.sets;
  h=head(esc(m.a)+' — '+esc(m.b),'open\',\''+d.id)+`</header><main><div class="board">`+[m.a,m.b].map((t,i)=>(i?'<div class="c">:</div>':'')+`<div><div class="n">${esc(t)}</div><div class="s">${sc(m,t)}</div>`+
   (vb?`<div class="clock">${m.c[t===m.a?'a':'b']}</div><div class="row"><button class="btn go" ${m.fin?'disabled':''} data-t="${esc(t)}" onclick="vp(this.dataset.t,1)">+1</button><button class="btn alt" ${m.fin?'disabled':''} data-t="${esc(t)}" onclick="vp(this.dataset.t,-1)">−1</button></div>`
   :`<div class="row" style="flex-wrap:wrap">${[1,2,3].map(n=>`<button class="btn go" ${m.fin?'disabled':''} data-t="${esc(t)}" onclick="bp(this.dataset.t,${n})">+${n}</button>`).join('')}</div>`)+`</div>`).join('')+`</div>`+
  `<div class="stat">${stt(m)} · ${vb?'сет есебі, төменде ағымдағы сет ұпайы':'ұпай есебі'}</div><div class="row">`+(!vb&&!m.fin?`<button class="btn alt" onclick="A('nq')">Келесі тоқсан</button>`:'')+
  `<button class="btn alt" onclick="A('fin')">${m.fin?'Қайта ашу':'Матчты аяқтау'}</button></div>`+
  (vb?`<h3>Сеттер</h3>`+(m.sets.length?m.sets.map((x,i)=>`<div class="card"><span>${i+1}-сет: <b>${x.a} : ${x.b}</b></span><span class="pill">${esc(x.w)}</span></div>`).join(''):'<div class="empty">Сет әлі аяқталған жоқ (25 ұпайға дейін, 2 ұпай айырмамен; 5-сет — 15)</div>')
   :`<h3>Ұпайлар</h3>`+(m.g.length?m.g.map((x,i)=>`<div class="card"><span>${x.q}-тоқсан · <b>${esc(x.p)}</b> (${esc(x.t)})</span><span>${m.fin?'':`<button class="ic" onclick="A('undo',${i})">✕</button>`}<span class="pill">+${x.pts}</span></span></div>`).join(''):'<div class="empty">Ұпай жоқ</div>'))+`</main>`}
 else if(v==='match'){
  const d=D(),m=M();if(!m){V.v='day';return render()}
  h=head(esc(m.a)+' — '+esc(m.b),'open\',\''+d.id)+`</header><main><div class="board">`+[m.a,m.b].map((t,i)=>(i?'<div class="c">:</div>':'')+`<div><div class="n">${esc(t)}</div><div class="s">${sc(m,t)}</div><button class="btn go" ${m.fin||m.br?'disabled':''} onclick="A('goal',this.dataset.t)" data-t="${esc(t)}">+1 Гол</button></div>`).join('')+`</div>`+
  `<div class="clock" id="clk">${clock(m.s)}</div><div class="stat">${stt(m)}</div><div class="row">`+
  (m.fin?'':(m.run?`<button class="btn" onclick="A('pause')">⏸ Тоқтату</button>`+(m.h===1?`<button class="btn alt" onclick="A('brk')">Перерыв</button>`:''):`<button class="btn" onclick="A('run')">▶ ${m.br?'2-тайм':'Бастау'}</button>`))+
  `<button class="btn alt" onclick="A('fin')">${m.fin?'Қайта ашу':'Матчты аяқтау'}</button></div><h3>Голдар</h3>`+
  (m.g.length?m.g.map((x,i)=>`<div class="card"><span>${x.min?x.min+"' ":''}<b>${esc(x.p)}</b> (${esc(x.t)})${x.a?` <small style="color:var(--mut)">🅰 ${esc(x.a)}</small>`:''}</span>${m.fin?'':`<button class="ic" onclick="A('undo',${i})">✕</button>`}</div>`).join(''):'<div class="empty">Гол жоқ</div>')+`</main>`;
  if(m.run)tick=setInterval(()=>{m.s++;const c=$('#clk');if(c)c.textContent=clock(m.s);if(m.s%15===0)save()},1000)}
 $('#app').innerHTML=h}
render();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script></body></html>
